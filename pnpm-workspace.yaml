allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  esbuild: true
  prisma: true
  # Dependência indireta do eslint-config-next. Sem ela, o pnpm 11 falha o
  # install com ERR_PNPM_IGNORED_BUILDS em máquina limpa (Vercel).
  unrs-resolver: true

overrides:
  deepmerge-ts: 8.0.2
  # GHSA-68fv-2mgg-jv7q: DoS via source-map section offsets (< 1.2.2)
  source-map-js: ^1.2.2
